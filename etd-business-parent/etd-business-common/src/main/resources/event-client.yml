# 事件客户端公共参数；工作节点编号由各应用单独指定，避免事件 ID 冲突。
etd:
  event:
    bus:
      topic: ${ETD_EVENT_TOPIC:etd.event.bus} # 向事件中心发送消息的统一 Kafka Topic。
      client:
        verify-connection-on-startup: ${ETD_EVENT_KAFKA_VERIFY_CONNECTION:true} # 启动时是否验证 Kafka 可连接。
        connection-timeout: ${ETD_EVENT_KAFKA_CONNECTION_TIMEOUT:10s} # 启动连接验证的最大等待时间。
        id-generator:
          worker-id: ${ETD_EVENT_WORKER_ID:1} # 事件 ID 工作节点，与 Event 默认节点区分。
          datacenter-id: ${ETD_EVENT_DATACENTER_ID:1} # 事件 ID 生成器的数据中心编号。
        async:
          core-pool-size: ${ETD_EVENT_ASYNC_CORE_POOL_SIZE:2} # 异步事件发送线程池核心线程数。
          max-pool-size: ${ETD_EVENT_ASYNC_MAX_POOL_SIZE:8} # 异步事件发送线程池最大线程数。
          queue-capacity: ${ETD_EVENT_ASYNC_QUEUE_CAPACITY:1000} # 异步事件发送线程池队列容量。
etd:
  mybatis:
    tenant:
      enabled: true # 启用 MyBatis-Plus 租户隔离插件。
      column-name: tenant_id # 业务表统一使用的租户字段名。
      # 以下系统公共表不追加 tenant_id 查询条件。
      ignore-tables:
        - sys_tenant
        - sys_menus
        - sys_dict_type
        - sys_dict_data
        - sys_config
        - oauth2_client
        - oauth2_scope
        - oauth2_client_scope
        - oauth2_authorization
        - oauth2_authorization_consent
    fill:
      enabled: true # 启用框架实体字段自动填充能力。
    data-permission:
      enabled: true # 启用组织和用户维度的数据权限过滤。
      # 以下平台公共表不追加组织数据权限条件。
      ignore-tables:
        - sys_tenant
        - sys_role
        - sys_user_role_rel
        - sys_user_org_rel
        - sys_role_org_rel
        - sys_role_menu_rel
        - sys_tenant_menu_rel
        - sys_organization
        - sys_menus
        - sys_dict_type
        - sys_dict_data
        - sys_config
        - oauth2_client
        - oauth2_scope
        - oauth2_client_scope
        - oauth2_authorization
        - oauth2_authorization_consent

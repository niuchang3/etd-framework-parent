# UPMS 服务公共配置，各环境差异连接信息应放入 application-{profile}.yml。
server:
  servlet:
    context-path: / # HTTP 接口使用根上下文路径。
  port: 8100 # UPMS 服务监听端口。

logging:
  level:
    root: INFO # 默认根日志级别，具体环境可以覆盖。
    org.etd.upms.config.mapper: DEBUG # 输出系统配置 Mapper 的 SQL 和绑定参数。
    org.etd.upms.dict.mapper: DEBUG # 输出字典 Mapper 的 SQL 和绑定参数。
    org.etd.upms.menu.mapper: DEBUG # 输出菜单 Mapper 的 SQL 和绑定参数。
    org.etd.upms.organization.mapper: DEBUG # 输出组织 Mapper 的 SQL 和绑定参数。
    org.etd.upms.role.mapper: DEBUG # 输出角色 Mapper 的 SQL 和绑定参数。
    org.etd.upms.tenant.mapper: DEBUG # 输出租户 Mapper 的 SQL 和绑定参数。
    org.etd.upms.user.mapper: DEBUG # 输出用户 Mapper 的 SQL 和绑定参数。

spring:
  jackson:
    time-zone: Asia/Shanghai # HTTP 时间字段统一按东八区序列化。
  profiles:
    active: local # 默认启用本地环境，可由启动参数覆盖。
  application:
    name: upms-server # 应用名称，同时用于日志、注册发现和缓存键前缀。
  config:
    # 组件配置由父 POM 打包到 classpath，应用专属配置随后加载。
    import:
      - classpath:redis.yml
      - classpath:druid.yml
      - classpath:kafka.yml
      - classpath:event-client.yml
      - classpath:etd-oauth.yml
      - classpath:etd-upms.yml

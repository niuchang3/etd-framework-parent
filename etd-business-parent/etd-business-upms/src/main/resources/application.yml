server:
  servlet:
    context-path: /
  port: 8100

logging:
  level:
    root: DEBUG
spring:
  jackson:
    time-zone: Asia/Shanghai
  profiles:
    active: local
  application:
    name: UPMS
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: 3s
      database: 4
      lettuce:
        pool:
          enabled: true
          min-idle: 10
          max-idle: 20
          max-active: 20
          max-wait: 5s

jetcache:
  statIntervalMinutes: 15
  areaInCacheName: false
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 1000
  remote:
    default:
      type: redis.springdata
      keyPrefix: "${spring.application.name}:"
      keyConvertor: fastjson2
      valueEncoder: bean:jetCacheFastjson2ValueEncoder
      valueDecoder: bean:jetCacheFastjson2ValueDecoder



system:
  security:
    access-token:
      expired: 60
      timeUnit: minutes

    refresh-token:
      expired: 7
      timeUnit: days

    permissions:
      ignore:
        - /public/**
        - /druid/**
        - /v1/config/values
        - /h2-console/**

    oauth2:
      authorization-server:
        enabled: "${UPMS_OAUTH2_AUTHORIZATION_SERVER_ENABLED:false}"
        issuer: "${UPMS_OAUTH2_ISSUER:http://127.0.0.1:${server.port}}"
      session:
        enabled: "${ETD_JSESSIONID_ENABLED:true}"
        timeout: "${ETD_JSESSIONID_TIMEOUT:30m}"
        namespace: "${ETD_JSESSIONID_NAMESPACE:etd:upms:oauth2:session}"
        cookie-name: "${ETD_JSESSIONID_COOKIE_NAME:ETD_JSESSIONID}"
        login-page: "${UPMS_OAUTH2_LOGIN_PAGE:/login}"
        consent-page: "${UPMS_OAUTH2_CONSENT_PAGE:/consent}"
        redirect-parameter: "${UPMS_OAUTH2_REDIRECT_PARAMETER:redirect}"
etd:
  mybatis:
    tenant:
      enabled: true
      column-name: tenant_id
      ignore-tables:
        - sys_tenant
        - sys_api
        - sys_menu_api_rel
        - sys_menus
        - sys_dict_type
        - sys_dict_data
        - sys_config
        - oauth2_client
        - oauth2_scope
        - oauth2_client_scope
        - oauth2_authorization
        - oauth2_authorization_consent
    fill:
      enabled: true
    data-permission:
      enabled: true
      ignore-tables:
        - sys_tenant
        - sys_user
        - sys_role
        - sys_user_role_rel
        - sys_user_org_rel
        - sys_role_org_rel
        - sys_role_menu_rel
        - sys_tenant_menu_rel
        - sys_organization
        - sys_menus
        - sys_api
        - sys_menu_api_rel
        - sys_dict_type
        - sys_dict_data
        - sys_config
        - oauth2_client
        - oauth2_scope
        - oauth2_client_scope
        - oauth2_authorization
        - oauth2_authorization_consent

etd:
  mybatis:
    fill:
      enabled: true # 框架填充租户、主组织、状态及审计字段。
    logic-delete:
      enabled: true # 自定义SELECT按实体@TableLogic自动排除已删除记录，不影响物理清理SQL。
    tenant:
      enabled: true # 租户连接及业务数据保留隔离，平台模型管理全局共享。
      ignore-tables:
        - ai_model # 平台管理员维护的全局模型管理，不含tenant_id。
    data-permission:
      enabled: true # 启用组织数据权限，租户共享表按下方清单排除。
      ignore-tables:
        - ai_model_connection # 租户级配置，无独立组织归属。
        - ai_model # 全局模型管理，无组织归属。
  ai:
    document:
      docling:
        enabled: ${DOCLING_ENABLED:false} # 显式启用手动解析和分片；关闭时上传及列表仍可使用。
        base-url: ${DOCLING_BASE_URL:} # Docling服务根地址，启用时必须提供，不带/ui或/docs。
        api-key: ${DOCLING_API_KEY:} # 服务认证凭证；本地服务未启用认证时可省略环境变量。
    knowledge:
      upload:
        cleanup-enabled: ${AI_UPLOAD_CLEANUP_ENABLED:true} # 每分钟扫描并取消过期上传，不需要独立清理表。
        max-file-bytes: ${AI_UPLOAD_MAX_FILE_BYTES:1073741824} # 原件大小上限，默认1GiB，不按扩展名校验上传。
        part-size-bytes: ${AI_UPLOAD_PART_SIZE_BYTES:10485760} # 固定上传分片大小，默认10MiB，不小于5MiB。
        session-seconds: ${AI_UPLOAD_SESSION_SECONDS:86400} # 断点续传会话有效期，默认24小时。
        url-seconds: ${AI_UPLOAD_URL_SECONDS:900} # 单次预签名上传及下载地址有效期，默认15分钟。
    credentials:
      key: ${AI_CREDENTIAL_ENCRYPTION_KEY:ZXRkLWFpLWxvY2FsLWRldmVsb3BtZW50LWtleS0wMDE=} # 仅供本地开发的固定32字节AES密钥，部署环境必须自行注入。
      key-id: ${AI_CREDENTIAL_KEY_ID:ai-local-01} # 本地默认密钥标识，与本地密钥固定配套使用。

system:
  security:
    permissions:
      ignore:
        - /actuator/health # 仅健康检查允许匿名。

management:
  endpoints:
    web:
      exposure:
        include: health # 仅开放健康端点。
  endpoint:
    health:
      show-details: never # 不向外暴露连接或依赖详情。

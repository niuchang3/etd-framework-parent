spring:
  datasource:
    druid:
      # 本地环境只定义 PostgreSQL 连接信息，连接池公共参数由 etd-business-common 的 druid.yml 提供。
      url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:30432}/${DB_NAME:ai-agent}
      username: ${DB_USERNAME:root} # PostgreSQL 用户名，仅提供本地开发默认值。
      password: ${DB_PASSWORD:123456} # PostgreSQL 密码，仅提供本地开发默认值。
      stat-view-servlet:
        enabled: true # 本地环境开启 Druid 监控页面。
        allow: 127.0.0.1 # 只允许本机访问 Druid 监控页面。
        deny: 192.168.56.1 # 明确拒绝该本地虚拟网卡地址访问。
        login-username: admin # 本地 Druid 监控页面登录账号。
        login-password: admin # 本地 Druid 监控页面登录密码。

etd:
  ai:
    document:
      docling:
        enabled: ${DOCLING_ENABLED:true} # 本地默认连接已部署的Docling，可通过环境变量关闭。
        base-url: ${DOCLING_BASE_URL:http://127.0.0.1:30501} # 已确认的本地NodePort地址，其他环境显式配置。

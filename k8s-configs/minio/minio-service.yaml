apiVersion: v1
kind: Service
metadata:
  name: minio-service
  labels:
    app: minio
spec:
  type: NodePort # 与仓库已有本地中间件的访问方式保持一致。
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: s3-api
      nodePort: 30900 # 本地 Java SDK 使用此端口，而非控制台端口。
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901 # 浏览器控制台入口。
